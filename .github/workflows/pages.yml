name: Deploy 2lus preview (public artifacts only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public site contains only HTML/CSS and no scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css .nojekyll _site/
          cp -R articles _site/articles
          if find _site -type f ! -name '*.html' ! -name '*.css' ! -name '.nojekyll' | grep -q .; then
            echo 'Unexpected public preview file'; exit 1
          fi
          if grep -REiq '<script|<iframe|fetch\(|localStorage|/api/' _site; then
            echo 'Active scripts and private APIs are forbidden'; exit 1
          fi
          if ! grep -Rql 'noindex,nofollow,noarchive' _site; then
            echo 'Missing noindex in preview'; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
